name: MineCord
version: '1.0'
main: com.example.minecord.MineCord
api-version: '1.13'
prefix: "\u00A7dMineCord\u00A7r"
authors: [ You ]
softdepend: [SkinsRestorer, BlueMap]
description: A plugin that connects Minecraft with Discord.
commands:
  discord:
    description: Головна команда плагіна MineCord
    usage: /discord [link]
  minecord:
    description: Альтернативна назва команди
    usage: /minecord [reload]
  map:
    description: Показати карту сервера
    usage: /map
  mail:
    description: Відправити офлайн повідомлення гравцю
    usage: /mail send <гравець> <повідомлення>
  ticket:
    description: Створити тікет для адміністрації
    usage: /ticket create <повідомлення>
  togglerestart:
    description: Вимкнути/увімкнути відображення попереджень про авторестарт для себе
    usage: /togglerestart
  stats:
    description: Статистика гравця
    usage: /stats [гравець]
  unmute:
    description: Зняти мут від антиспаму з гравця
    usage: /unmute <гравець>
    permission: minecord.admin
  top:
    description: Топ гравців за статистикою
    usage: /top [категорія]
  report:
    description: Надіслати скаргу на гравця модераторам
    usage: /report <гравець> <причина>
  sharecoords:
    aliases: [coords]
    description: Поділитися координатами з описом місця
    usage: /sharecoords <опис місця>
