# Конфігурація плагіна MineCord
discord:
  # Вставте сюди токен вашого бота (з Discord Developer Portal)
  token: "YOUR_DISCORD_BOT_TOKEN_HERE"
  # ID каналу, куди будуть надсилатися повідомлення з ігрового чату
  chat-channel-id: "000000000000000000"
  # ID секретного каналу для трансляції консолі сервера
  console-channel-id: "000000000000000000"
  # ID каналу для заявок модераторам
  moderator-channel-id: "000000000000000000"
  # ID вашого Discord сервера
  guild-id: "000000000000000000"
  # Посилання на веб-мапу сервера (BlueMap / Dynmap)
  map-url: "http://ge-r2.eternalhosting.cloud:27218/"

# Система приватного доступу (White-list)
whitelist:
  # Якщо true, гравці без прив'язаного Discord або ролі не зможуть зайти
  enabled: false
  # ID ролі, яку ОБОВ'ЯЗКОВО повинен мати гравець. Залиште порожнім "", якщо перевірка ролі не потрібна
  require-discord-role: ""
  kick-messages:
    not-linked: "§cВи повинні прив'язати свій акаунт до Discord!\n§eЗайдіть у наш Discord та введіть команду:\n§b/link code %code%"
    no-role: "§cУ вас немає необхідної ролі в нашому Discord для гри на цьому сервері."
    not-in-guild: "§cВи повинні бути учасником нашого Discord-сервера!"

# Налаштування динамічного статусу бота в Discord
status:
  enabled: false
  # Інтервал ротації статусу в секундах (рекомендовано 15-30)
  update-interval-seconds: 15
  # Список повідомлень для почергової ротації (підтримуються %online%, %max%, %tps%, %uptime%)
  messages:
    - "Minecraft (%online%/%max%)"
    - "TPS: %tps% | Аптайм: %uptime%"
  # Текст за замовчуванням (якщо messages вимкнено або порожній)
  text: "Грає в Minecraft (%online%/%max%)"

# Налаштування сповіщень про ігрові події
events:
  server-start: "✅ **Сервер успішно запущено!**"
  server-stop: "🛑 **Сервер вимкнено!**"
  join-leave: true
  first-join: true
  death: true
  night-skip: false
  dragon: false # Сповіщення про призов та перемогу над Ендер Драконом

# Налаштування системи скарг на порушників (/report)
report:
  # Затримка між повторними скаргами від одного гравця в секундах
  cooldown-seconds: 60

# Періодичні підказки та поради (надсилаються кожному гравцю особисто у випадковий час)
tips:
  # Чи ввімкнено надсилання підказок
  enabled: true
  # Мінімальний інтервал між підказками для гравця у хвилинах (60 = 1 година)
  min-interval-minutes: 60
  # Максимальний інтервал між підказками для гравця у хвилинах (120 = 2 години)
  max-interval-minutes: 120
  # Список підказок (підтримуються кольорові коди § та &)
  messages:
    - "&6&l[Порада] &eВи можете оглянути світ з висоти пташиного польоту! Введіть &b/map&e, щоб отримати посилання на інтерактивну 3D-мапу сервера."
    - "&6&l[Порада] &eДруга немає в мережі? Надішліть йому листа через &b/mail <нік> <текст>&e! Лист надійде в особисті Discord, якщо він прив'язаний (&b/discord link&e)."
    - "&6&l[Порада] &eПрив'яжіть акаунт через &b/discord link&e, щоб друзі могли надсилати вам повідомлення з гри в Discord командою &b/mail&e!"
    - "&6&l[Порада] &eЗнайшли баг або потрібна допомога адміністрації? Напишіть &b/ticket create <текст>&e, і ваше звернення миттєво надійде модераторам у Discord!"
    - "&6&l[Порада] &eЦікаво, скільки годин ви провели у грі та скільки разів загинули? Перевірте це командою &b/stats&e!"
    - "&6&l[Порада] &eПрив'яжіть свій ігровий профіль до нашого Discord-сервера через &b/discord link&e, щоб синхронізувати акаунт та отримати роль!"
    - "&6&l[Порада] &eХочете привернути увагу друга в чаті? Напишіть &b@ЙогоНік&e — він почує звуковий сигнал, а повідомлення підсвітиться яскраво-жовтим!"
    - "&6&l[Порада] &eНастала ніч? Не обов'язково спати всім гравцям — достатньо кільком лягти в ліжко, щоб разом пропустити темряву та грозу."
    - "&6&l[Порада] &eТерміново треба відійти від гри? Не бійтеся: в режимі &7[AFK]&e ворожі моби вас не чіпають, не атакують і не можуть скинути з місця!"
    - "&6&l[Порада] &eЯкщо вам заважають часті титри та нагадування про плановий рестарт сервера, ви можете вимкнути їх для себе командою &b/togglerestart&e."
    - "&6&l[Порада] &eЗатисніть клавішу &bTab&e, щоб побачити стабільність сервера (TPS), ваш поточний пінг та список усіх гравців у мережі."
    - "&6&l[Порада] &eЗнаходитесь не в грі? Ви завжди можете спілкуватися з гравцями на сервері прямо з текстового чату нашого Discord!"
    - "&6&l[Порада] &eХочете дізнатися, хто на сервері найбільше награв годин, добув алмазів чи вбив мобів? Перегляньте рейтинги командою &b/top&e!"
    - "&6&l[Порада] &eЗнайшли цікаве місце чи базу? Поділіться координатами з друзями в один клік командою &b/sharecoords <опис>&e з посиланням на 3D-мапу!"
    - "&6&l[Порада] &eПомітили порушника або спамера? Надішліть швидку скаргу модераторам у Discord командою &b/report <нік> <причина>&e!"
    - "&6&l[Порада] &eЗагинули і загубили речі? У повідомленні про смерть у чаті завжди є точні координати та посилання на 3D-мапу!"
    - "&6&l[Порада] &eЗачарували тризубець на &bТягун&e? На сервері ви можете здійснювати потужні ривки прямо на суші без води та дощу!"
    - "&6&l[Порада] &eОзброюйтесь списами! Усі види списів не витрачають вашу ситість та рівень голоду в бою."
    - "&6&l[Порада] &eЩовечора є 5% шанс на настання &4&lКривавого Місяця&e! Монстри стають лютішими, спавняться орди та боси, а сон заблоковано."
    - "&6&l[Порада] &eПід час &4Кривавого Місяця&e випадає подвійний досвід, а з міні-босів можна вибити алмази, незерит та тотеми безсмертя!"
    - "&6&l[Порада] &eНе бійтеся перековувати броню багато разів — обмеження &c«Занадто дорого»&e вимкнено, тож предмети можна лагодити вічно!"

# Налаштування AFK-системи
afk:
  # Чи ввімкнено систему AFK на сервері
  enabled: true
  # Час неактивності в секундах до переходу в AFK (за замовчуванням 60 = 1 хвилина)
  timeout-seconds: 60
  # Невразливість та захист від мобів (не атакують, скидають ціль, не штовхають та не завдають шкоди)
  mob-invulnerable: true

# Налаштування розумного пропуску ночі (Sleep Voting)
sleep:
  # Чи ввімкнено кастомну систему пропуску ночі
  enabled: true
  # Відсоток активних гравців, необхідних для пропуску ночі (50 = 50%)
  percentage: 50
  # Чи ігнорувати гравців у режимі AFK
  ignore-afk: true

# Захист від спаму в чаті (AntiSpam)
antispam:
  # Чи ввімкнено захист від спаму
  enabled: false
  # Мінімальна затримка між повідомленнями у мілісекундах (700 мс = 0.7 сек)
  cooldown-ms: 700
  # Захист від повторення однакових повідомлень (у секундах, діє лише для слів довше 3 символів)
  duplicate-timeout-seconds: 3
  # Кількість попереджень до тимчасового муту
  max-warnings: 5
  # Тривалість муту в секундах (за замовчуванням 60 сек = 1 хвилина)
  mute-duration-seconds: 60

# Режим технічних робіт (Maintenance)
maintenance:
  enabled: false
  message: "§c🛠️ Сервер зараз на стадії розробки та тестування.\n§eПовертайтеся згодом!"

# Модератор чату
ai-moderator:
  enabled: false
  api-key: "YOUR_OPENROUTER_API_KEY"
  kick-player: false # Виганяти гравця з сервера?
  appeal-channel-id: "000000000000000000"
  kick-message: "§cВаше повідомлення було заблоковано модератором чату через нецензурну лексику або токсичність."
  warn-message: "§c[Модер] §eТвоє повідомлення порушує правила сервера. Будь ввічливішим!"

# Авторестарти
autorestart:
  # Мінімальний час роботи сервера (у хвилинах) для виконання планового рестарту.
  # Запобігає подвійному рестарту, якщо сервер щойно перезапускався (через чергу чи вручну).
  min-uptime-minutes: 15

  # Час у форматі HH:mm за Києвом. Приклад: ["04:00"]
  # За замовчуванням порожній (без пресетів). Додавайте час через команду /autorestart add або вручну в конфіг
  times: []
  
  # Сповіщення в чат (секунди : повідомлення)
  messages:
    "600": "Сервер перезавантажиться через 10 хвилин!"
    "300": "Сервер перезавантажиться через 5 хвилин!"
    "60": "Сервер перезавантажиться через 1 хвилину!"
    "10": "Сервер перезавантажиться через 10 секунд!"
    "3": "Рестарт через 3..."
    "2": "Рестарт через 2..."
    "1": "Рестарт через 1..."
    "0": "Перезавантаження..."
    
  # Гігантський текст на екрані (Title) (секунди : текст)
  titles:
    "300": "§c§lУвага"
    "5": "§c§lРестарт"
    "4": "§c§lРестарт"
    "3": "§c§lРестарт"
    "2": "§c§lРестарт"
    "1": "§c§lРестарт"
    "0": "§c§lПерезавантаження!"
    
  # Маленький текст під Title (секунди : текст)
  subtitles:
    "300": "§6Сервер перезавантажиться через 5 хвилин"
    "5": "§eчерез 5..."
    "4": "§eчерез 4..."
    "3": "§eчерез 3..."
    "2": "§eчерез 2..."
    "1": "§eчерез 1..."
    "0": ""
    
  # Команди, які виконуватимуться при досягненні 0 секунд
  commands:
    - "restart"

# Періодичне оновлення веб-карти (BlueMap)
bluemap:
  auto-reload:
    # Чи ввімкнено автоматичне оновлення карти
    enabled: false
    # Автоматичне оновлення невдовзі після запуску сервера (у секундах, 120 = 2 хв)
    reload-on-startup: false
    startup-delay-seconds: 120
    # Фіксований час оновлення мапи за київським часом (формат HH:mm). Приклад: ["16:00"]
    times: []
    # Консольна команда для перезавантаження BlueMap
    command: "bluemap reload"

# Технічні налаштування (для адміністраторів)
technical:
  error-catcher:
    enabled: false
    # API для завантаження великих логів помилок
    paste-service: "https://paste.md-5.net/documents"
  performance-monitor:
    enabled: false
    # Якщо TPS падає нижче цього значення - буде тривога
    tps-threshold: 15.0
    # Якщо використано більше відсотків RAM - буде тривога
    ram-threshold-percent: 95.0
    # Кулдаун між сповіщеннями (щоб не спамило щосекунди)
    cooldown-minutes: 5
    # Якщо true, плагін спробує запустити /spark profiler start автоматично (потрібен плагін Spark)
    auto-spark: false

sentry:
  enabled: false
  dsn: ""

# Синхронізація ролей з Discord до Minecraft (TAB, чат, кольори нікнеймів та сортування)
role-sync:
  # Чи ввімкнено синхронізацію ролей
  enabled: true
  # Відображати префікс ролі у TAB-листі
  tab-prefix: true
  # Відображати префікс ролі та емодзі над головою гравця у грі (у 3D світі)
  nametag-prefix: true
  # Сортувати гравців у TAB за ієрархією ролей (через Scoreboard Teams)
  tab-sorting: true
  # Чи змінювати колір Scoreboard команди відповідно до ролі (за замовчуванням false).
  nametag-color: false
  # Додавати префікс ролі перед повідомленнями гравця у внутрішньоігровому чаті
  chat-prefix: true
  # Періодичний інтервал перевірки та синхронізації ролей у секундах (за замовчуванням 60)
  sync-interval-seconds: 60

  # Налаштування ролей за ієрархією (пріоритет: 1 - найвищий)
  # Можна вказувати role-id (ID ролі в Discord) та/або role-name (назву ролі в Discord, ігнорує регістр)
  roles:
    senior_moderator:
      role-id: ""
      role-name: "⚔️ Ст.Модератор"
      prefix: "&#9305DC&l[⚔ &#b832f5&lСт. Модератор&#9305DC&l] &r"
      color: "DARK_PURPLE"
      priority: 1
    developer:
      role-id: ""
      role-name: "💻 Розробник"
      prefix: "&#ffffff&l[💻 &#e0e0e0&lРозробник&#ffffff&l] &r"
      color: "WHITE"
      priority: 2
    moderator:
      role-id: ""
      role-name: "🛡️ Модератор"
      prefix: "&#3CB5E9&l[🛡 &#6ed0fc&lМодератор&#3CB5E9&l] &r"
      color: "AQUA"
      priority: 3
    vip_sponsor:
      role-id: ""
      role-name: "👑 VIP Спонсор"
      prefix: "&#EEAC1C&l[👑 &#f7c95e&lVIP Спонсор&#EEAC1C&l] &r"
      color: "GOLD"
      priority: 4
    sponsor:
      role-id: ""
      role-name: "💵 Спонсор"
      prefix: "&#31CA6C&l[💵 &#57e68e&lСпонсор&#31CA6C&l] &r"
      color: "GREEN"
      priority: 5
    player:
      role-id: ""
      role-name: "⛏️ Гравець"
      prefix: "&#8A7E7E[⛏ Гравець] &r"
      color: "GRAY"
      priority: 6

  # Налаштування для гравців без прив'язаного акаунта до Discord
  unlinked:
    prefix: "&#706868"
    color: "GRAY"
    priority: 99

# =======================================================
# Розважальні режими та міні-ігри на сервері (Fun Modes)
# Тут налаштовуються додаткові ігрові режими сервера
# =======================================================
fun:
  # Чи ввімкнено модуль розважальних режимів
  enabled: true

  # Режими (активуватимуться та налаштовуватимуться за побажаннями)
  modes:
    # 1. Тягун без дощу (Riptide without rain)
    # Дозволяє запускатися тризубцем з чарами Тягун на суші без води та дощу
    riptide_no_rain:
      enabled: true
      # Затримка між ривками у тіках (20 тіків = 1 секунда)
      cooldown_ticks: 15
      # Множник швидкості польоту
      velocity_multiplier: 1.0
      # Захист від розбивання об землю (Fall damage) на перше приземлення після ривка
      prevent_fall_damage: true
      # Чи завдавати таранної шкоди сутностям на шляху польоту (як у ванільному Тягуні)
      damage_entities: true
      # Кількість шкоди при тарані мобів
      damage_amount: 8.0
      # Скільки одиниць міцності забирати за ривок (з урахуванням чар Незламність)
      durability_cost: 1

    # 2. Спис без витрати ситості (Spears without hunger/exhaustion)
    # Дозволяє використовувати всі види списів без голоду та виснаження
    spear_no_hunger:
      enabled: true
      # Чи блокувати витрату голоду завжди, поки спис у руці (false), чи тільки під час атак (true)
      only_on_attack: false
      # Матеріали списів
      materials:
        - "WOODEN_SPEAR"
        - "STONE_SPEAR"
        - "COPPER_SPEAR"
        - "IRON_SPEAR"
        - "GOLDEN_SPEAR"
        - "DIAMOND_SPEAR"
        - "NETHERITE_SPEAR"

    # 3. Розумне ковадло (Smart Anvil)
    # Знімає ліміт 40 рівнів ("Занадто дорого!"), дозволяючи вартості ремонту зростати й далі
    smart_anvil:
      enabled: true
      # Максимальна вартість ремонту
      max_repair_cost: 2147483647
      # Відображати точну кількість необхідного досвіду в Action Bar
      show_actionbar_info: true

    # 4. Кривавий Місяць (Bloodmoon Event)
    # Періодична ніч кошмарів із червоним небом, ордами, міні-босами та сповіщеннями в Discord.
    bloodmoon:
      enabled: true
      # Тривалість ночі Кривавого Місяця у хвилинах
      duration_minutes: 10
      # Шанс настання Кривавого Місяця кожного заходу сонця (у відсотках, 5.0 = 5%)
      chance_percent: 5.0
      # Чи блокувати сон у ліжках під час Кривавого Місяця
      block_beds: true
      # Чи вмикати червону віньєтку, дощ та червоні частинки попелу
      red_sky_effects: true
      # Чи спавнити періодичні орди агресивних мобів біля гравців
      hordes_enabled: true
      # Інтервал між спавном орд (у секундах)
      horde_interval_seconds: 90
      # Чи надсилати ембеди про початок та кінець ночі в Discord
      discord_announcements: true
      # Чи ослабляти монстрів, що залишились після закінчення ночі
      weaken_mobs_on_end: true
      # Світи, в яких активний Кривавий Місяць
      worlds:
        - "world"
      # Рівні загрози (Tiers)
      tiers:
        tier_1:
          level: 1
          name: "Кривавий Місяць"
          weight: 60
          health_multiplier: 1.6
          speed_level: 0
          strength_level: 0
          resistance_level: 0
          armor_chance: 40
          exp_multiplier: 2.0
          boss_chance: 20.0
          horde_min: 4
          horde_max: 8
          boss_name: "§5§lКривавий Жнець"
          bar_color: "RED"
          discord_color: 14483456 # 0xDD0000
        tier_2:
          level: 2
