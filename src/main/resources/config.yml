# Конфігурація плагіна MineCord
discord:
  # Вставте сюди токен вашого бота (з Discord Developer Portal)
  token: "YOUR_DISCORD_BOT_TOKEN_HERE"
  # ID каналу, куди будуть надсилатися повідомлення з ігрового чату
  chat-channel-id: "000000000000000000"
  # ID секретного каналу для трансляції консолі сервера
  console-channel-id: "000000000000000000"
  # ID каналу для заявок модераторам
  moderator-channel-id: "000000000000000000"
  # ID вашого Discord сервера
  guild-id: "000000000000000000"
  # Посилання на веб-мапу сервера (BlueMap / Dynmap)
  map-url: "http://localhost:8123/"

# Система приватного доступу (White-list)
whitelist:
  # Якщо true, гравці без прив'язаного Discord або ролі не зможуть зайти
  enabled: false
  # ID ролі, яку ОБОВ'ЯЗКОВО повинен мати гравець. Залиште порожнім "", якщо перевірка ролі не потрібна
  require-discord-role: ""
  kick-messages:
    not-linked: "§cВи повинні прив'язати свій акаунт до Discord!\n§eЗайдіть у наш Discord та введіть команду:\n§b/link code %code%"
    no-role: "§cУ вас немає необхідної ролі в нашому Discord для гри на цьому сервері."
    not-in-guild: "§cВи повинні бути учасником нашого Discord-сервера!"

# Налаштування динамічного статусу бота в Discord
status:
  enabled: true
  # Інтервал ротації статусу в секундах (рекомендовано 15-30)
  update-interval-seconds: 15
  # Список повідомлень для почергової ротації (підтримуються %online%, %max%, %tps%, %uptime%)
  messages:
    - "Minecraft (%online%/%max%)"
    - "TPS: %tps% | Аптайм: %uptime%"
    - "Онлайн: %online% | /discord"
  # Текст за замовчуванням (якщо messages вимкнено або порожній)
  text: "Грає в Minecraft (%online%/%max%)"

# Налаштування сповіщень про ігрові події
events:
  server-start: "✅ **Сервер успішно запущено! Можна заходити!**"
  server-stop: "🛑 **Сервер вимкнено!**"
  join-leave: true
  first-join: true
  death: true
  night-skip: true
  dragon: true # Сповіщення про призов та перемогу над Ендер Драконом

# Налаштування системи скарг на порушників (/report)
report:
  # Затримка між повторними скаргами від одного гравця в секундах
  cooldown-seconds: 60

# Випадкові поради та факти для гравців при вході
join-tips:
  # Чи показувати підказки при вході на сервер
  enabled: true
  # Шанс показу підказки у відсотках (від 1 до 100). 20 = приблизно 1 раз на 5 входів
  chance-percent: 20
  # Затримка перед показом (у секундах), щоб повідомлення не губилося серед привітань
  delay-seconds: 4
  # Список підказок (підтримуються кольорові коди § та &)
  messages:
    - "&6&l[Порада] &eВи можете оглянути світ з висоти пташиного польоту! Введіть &b/map&e, щоб отримати посилання на інтерактивну 3D-мапу сервера."
    - "&6&l[Порада] &eДруга немає в мережі? Надішліть йому листа через &b/mail send <нік> <текст>&e. Він прочитає його, щойно зайде на сервер!"
    - "&6&l[Порада] &eНе забувайте перевіряти поштову скриньку командою &b/mail read&e — раптом хтось із друзів залишив вам листа, поки ви були офлайн?"
    - "&6&l[Порада] &eЗнайшли баг або потрібна допомога адміністрації? Напишіть &b/ticket create <текст>&e, і ваше звернення миттєво надійде модераторам у Discord!"
    - "&6&l[Порада] &eЦікаво, скільки годин ви провели у грі та скільки разів загинули? Перевірте це командою &b/stats&e!"
    - "&6&l[Порада] &eПрив'яжіть свій ігровий профіль до нашого Discord-сервера через &b/discord link&e, щоб синхронізувати акаунт та отримати роль!"
    - "&6&l[Порада] &eХочете привернути увагу друга в чаті? Напишіть &b@ЙогоНік&e — він почує звуковий сигнал, а повідомлення підсвітиться яскраво-жовтим!"
    - "&6&l[Порада] &eНастала ніч? Не обов'язково спати всім гравцям — достатньо кільком лягти в ліжко, щоб разом пропустити темряву та грозу."
    - "&6&l[Порада] &eТерміново треба відійти від гри? Не бійтеся: в режимі &7[AFK]&e ворожі моби вас не чіпають, не атакують і не можуть скинути з місця!"
    - "&6&l[Порада] &eЯкщо вам заважають часті титри та нагадування про плановий рестарт сервера, ви можете вимкнути їх для себе командою &b/togglerestart&e."
    - "&6&l[Порада] &eЗатисніть клавішу &bTab&e, щоб побачити стабільність сервера (TPS), ваш поточний пінг та список усіх гравців у мережі."
    - "&6&l[Порада] &eЗнаходитесь не в грі? Ви завжди можете спілкуватися з гравцями на сервері прямо з текстового чату нашого Discord!"
    - "&6&l[Порада] &eХочете дізнатися, хто на сервері найбільше награв годин, добув алмазів чи вбив мобів? Перегляньте рейтинги командою &b/top&e!"
    - "&6&l[Порада] &eЗнайшли цікаве місце чи базу? Поділіться координатами з друзями в один клік командою &b/sharecoords <опис>&e з посиланням на 3D-мапу!"
    - "&6&l[Порада] &eПомітили порушника або спамера? Надішліть швидку скаргу модераторам у Discord командою &b/report <нік> <причина>&e!"
    - "&6&l[Порада] &eЗагинули і загубили речі? У повідомленні про смерть у чаті завжди є точні координати та посилання на 3D-мапу!"

# Налаштування AFK-системи
afk:
  # Чи ввімкнено систему AFK на сервері
  enabled: true
  # Час неактивності в секундах до переходу в AFK (за замовчуванням 60)
  timeout-seconds: 60
  # Невразливість та захист від мобів (не атакують, скидають ціль, не штовхають та не завдають шкоди)
  mob-invulnerable: true

# Захист від спаму в чаті (AntiSpam)
antispam:
  # Чи ввімкнено захист від спаму
  enabled: true
  # Мінімальна затримка між повідомленнями у мілісекундах (700 мс = 0.7 сек)
  cooldown-ms: 700
  # Захист від повторення однакових повідомлень (у секундах, діє лише для слів довше 3 символів)
  duplicate-timeout-seconds: 3
  # Кількість попереджень до тимчасового муту
  max-warnings: 5
  # Тривалість муту в секундах (за замовчуванням 60 сек = 1 хвилина)
  mute-duration-seconds: 60

# Режим технічних робіт (Maintenance)
maintenance:
  enabled: false
  message: "§c🛠️ Сервер зараз на стадії розробки та тестування.\n§eПовертайтеся згодом!"

# Модератор чату
ai-moderator:
  enabled: false
  api-key: "YOUR_OPENROUTER_API_KEY"
  kick-player: false # Виганяти гравця з сервера?
  appeal-channel-id: "000000000000000000"
  kick-message: "§cВаше повідомлення було заблоковано модератором чату через нецензурну лексику або токсичність."
  warn-message: "§c[Модер] §eТвоє повідомлення порушує правила сервера. Будь ввічливішим!"

# Авторестарти
autorestart:
  # Мінімальний час роботи сервера (у хвилинах) для виконання планового рестарту.
  # Запобігає подвійному рестарту, якщо сервер щойно перезапускався (через чергу чи вручну).
  min-uptime-minutes: 15

  # Час у форматі HH:mm за Києвом. Приклад: "04:00"
  times:
    - "04:00"
  
  # Сповіщення в чат (секунди : повідомлення)
  messages:
    "600": "Сервер перезавантажиться через 10 хвилин!"
    "300": "Сервер перезавантажиться через 5 хвилин!"
    "60": "Сервер перезавантажиться через 1 хвилину!"
    "10": "Сервер перезавантажиться через 10 секунд!"
    "3": "Рестарт через 3..."
    "2": "Рестарт через 2..."
    "1": "Рестарт через 1..."
    "0": "Перезавантаження..."
    
  # Гігантський текст на екрані (Title) (секунди : текст)
  titles:
    "300": "§c§lУвага"
    "5": "§c§lРестарт"
    "4": "§c§lРестарт"
    "3": "§c§lРестарт"
    "2": "§c§lРестарт"
    "1": "§c§lРестарт"
    "0": "§c§lПерезавантаження!"
    
  # Маленький текст під Title (секунди : текст)
  subtitles:
    "300": "§6Сервер перезавантажиться через 5 хвилин"
    "5": "§eчерез 5..."
    "4": "§eчерез 4..."
    "3": "§eчерез 3..."
    "2": "§eчерез 2..."
    "1": "§eчерез 1..."
    "0": ""
    
  # Команди, які виконуватимуться при досягненні 0 секунд
  commands:
    - "restart"

# Періодичне оновлення веб-карти (BlueMap)
bluemap:
  auto-reload:
    # Чи ввімкнено автоматичне оновлення карти
    enabled: true
    # Інтервал у годинах (наприклад, кожні 2 години)
    interval-hours: 2
    # Консольна команда для перезавантаження BlueMap
    command: "bluemap reload"

# Технічні налаштування (для адміністраторів)
technical:
  error-catcher:
    enabled: true
    # API для завантаження великих логів помилок
    paste-service: "https://paste.md-5.net/documents"
  performance-monitor:
    enabled: true
    # Якщо TPS падає нижче цього значення - буде тривога
    tps-threshold: 15.0
    # Якщо використано більше відсотків RAM - буде тривога
    ram-threshold-percent: 95.0
    # Кулдаун між сповіщеннями (щоб не спамило щосекунди)
    cooldown-minutes: 5
    # Якщо true, плагін спробує запустити /spark profiler start автоматично (потрібен плагін Spark)
    auto-spark: false


sentry:
  enabled: false
  dsn: ""