name: Build MineCord Plugin

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5' # Використовуємо Gradle 8.5 напряму

    - name: Build with Gradle shadowJar
      run: gradle shadowJar

    - name: Upload Plugin Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MineCord-Plugin
        path: build/libs/*-all.jar

    - name: Deploy to Server via SFTP
      env:
        FTP_SERVER: ${{ secrets.FTP_SERVER }}
        FTP_PORT: ${{ secrets.FTP_PORT }}
        FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      run: |
        JAR_FILE=$(find build/libs -name "*-all.jar" | head -n 1)
        FILENAME=$(basename "$JAR_FILE")
        echo "Uploading $FILENAME to server..."
        curl -k -T "$JAR_FILE" sftp://$FTP_SERVER:$FTP_PORT/plugins/$FILENAME --user "$FTP_USERNAME:$FTP_PASSWORD"

    - name: Restart Server via Pterodactyl API
      env:
        PTERODACTYL_URL: ${{ secrets.PTERODACTYL_URL }}
        PTERODACTYL_KEY: ${{ secrets.PTERODACTYL_KEY }}
        PTERODACTYL_SERVER_ID: ${{ secrets.PTERODACTYL_SERVER_ID }}
      run: |
        echo "Sending restart signal to panel..."
        curl -s -X POST "$PTERODACTYL_URL/api/client/servers/$PTERODACTYL_SERVER_ID/power" \
          -H "Authorization: Bearer $PTERODACTYL_KEY" \
          -H "Accept: application/json" \
          -H "Content-Type: application/json" \
          -d '{"signal": "restart"}'
        echo "Restart signal sent!"
