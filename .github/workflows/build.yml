name: Build MineCord Plugin

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Build with Gradle shadowJar
      run: gradle shadowJar

    - name: Upload Plugin Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MineCord-Plugin
        path: build/libs/*-all.jar

    - name: Deploy to Server via SFTP
      env:
        FTP_SERVER: ${{ secrets.FTP_SERVER }}
        FTP_PORT: ${{ secrets.FTP_PORT }}
        FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      run: |
        JAR_FILE=$(find build/libs -name "*-all.jar" | head -n 1)
        FILENAME=$(basename "$JAR_FILE")
        
        # Очищаємо адресу від sftp://, зайвих слешів та портів, якщо користувач вставив їх випадково
        CLEAN_SERVER=$(echo "$FTP_SERVER" | sed -e 's|^sftp://||' -e 's|/.*$||' -e 's|:[0-9]*$||' | tr -d '[:space:]')
        CLEAN_PORT=$(echo "$FTP_PORT" | tr -dc '0-9')
        if [ -z "$CLEAN_PORT" ]; then CLEAN_PORT=2022; fi

        echo "Uploading $FILENAME to $CLEAN_SERVER:$CLEAN_PORT..."
        curl -k --connect-timeout 20 -T "$JAR_FILE" sftp://$CLEAN_SERVER:$CLEAN_PORT/plugins/$FILENAME --user "$FTP_USERNAME:$FTP_PASSWORD"

