plugins {
    id 'java'
    // Використовуємо оновлений shadow plugin (Goooler fork) який підтримує Java 21
    id 'io.github.goooler.shadow' version '8.1.8'
}

group = 'com.example'
version = '1.0-26.2'

repositories {
    mavenCentral()
    maven {
        name = "spigotmc-repo"
        url = "https://hub.spigotmc.org/nexus/content/repositories/snapshots/"
    }
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }
}

dependencies {
    // Використовуємо Paper API замість Spigot API (Paper містить метод getTPS())
    compileOnly 'io.papermc.paper:paper-api:1.20.1-R0.1-SNAPSHOT'
    
    // Бібліотека JDA для роботи з Discord
    implementation('net.dv8tion:JDA:5.0.0-beta.21') {
        // Виключаємо транзитивний okhttp щоб використовувати нашу явну версію
        exclude group: 'com.squareup.okhttp3', module: 'okhttp'
    }
    
    // Явна версія OkHttp3 — без неї Kotlin inline-класи ($$inlined$) з Http2Connection не знаходяться
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    
    // Sentry для відлову помилок
    implementation 'io.sentry:sentry:6.33.1'
}

def targetJavaVersion = 21 // Використовуємо Java 21, що є стандартом для нових версій
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

def getGitHash = { ->
    try {
        def proc = "git rev-parse --short HEAD".execute()
        proc.waitFor()
        def res = proc.text.trim()
        return res.isEmpty() ? "unknown" : res
    } catch (Exception e) {
        return "unknown"
    }
}

def getGitMessage = { ->
    try {
        def proc = "git log -1 --pretty=%B".execute()
        proc.waitFor()
        def res = proc.text.trim().replaceAll("[\r\n]+", " ")
        return res.isEmpty() ? "development build" : res
    } catch (Exception e) {
        return "development build"
    }
}

def getGitStats = { ->
    try {
        def proc = ["git", "show", "--shortstat", "--format=", "HEAD"].execute()
        proc.waitFor()
        def text = proc.text.trim()
        def files = "0"
        def ins = "0"
        def del = "0"
        def mFiles = text =~ /(\d+)\s+file/
        if (mFiles.find()) files = mFiles.group(1)
        def mIns = text =~ /(\d+)\s+insertion/
        if (mIns.find()) ins = mIns.group(1)
        def mDel = text =~ /(\d+)\s+deletion/
        if (mDel.find()) del = mDel.group(1)
        return [files: files, insertions: ins, deletions: del]
    } catch (Exception e) {
        return [files: "0", insertions: "0", deletions: "0"]
    }
}

processResources {
    def gitHash = getGitHash()
    def gitMsg = getGitMessage()
    def gitStats = getGitStats()
    inputs.property "gitHash", gitHash
    inputs.property "gitMsg", gitMsg
    inputs.property "gitFiles", gitStats.files
    inputs.property "gitInsertions", gitStats.insertions
    inputs.property "gitDeletions", gitStats.deletions
    filesMatching("git.properties") {
        expand(
            'gitHash': gitHash,
            'gitMsg': gitMsg,
            'buildTime': new Date().format("dd.MM.yyyy HH:mm:ss"),
            'gitFiles': gitStats.files,
            'gitInsertions': gitStats.insertions,
            'gitDeletions': gitStats.deletions
        )
    }
}

// Налаштовуємо shadowJar для збірки
shadowJar {
    // DO NOT relocate net.dv8tion, it breaks JDA internally!
    // DO NOT relocate okhttp3/okio — Shadow plugin cannot handle Kotlin $$inlined$ classes
    relocate 'com.fasterxml.jackson', 'com.example.minecord.libs.com.fasterxml.jackson'
    relocate 'org.apache.commons.collections4', 'com.example.minecord.libs.org.apache.commons.collections4'
    relocate 'gnu.trove', 'com.example.minecord.libs.gnu.trove'
    relocate 'com.neovisionaries.ws.client', 'com.example.minecord.libs.com.neovisionaries.ws.client'
    relocate 'io.sentry', 'com.example.minecord.libs.io.sentry'
}

